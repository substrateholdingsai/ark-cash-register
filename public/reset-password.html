<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restablecer contraseña — Ark Cash Register</title>
<style>body{font-family:Inter,Arial,sans-serif;background:#f5f7fa;padding:24px;color:#1e293b}.card{max-width:480px;margin:40px auto;background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:32px}h1{color:#002B7F;font-size:22px}label{display:block;margin:12px 0 4px;font-size:14px}input{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px;font-size:14px}button{background:#002B7F;color:#fff;border:0;padding:12px 24px;border-radius:6px;font-weight:600;cursor:pointer;margin-top:16px;width:100%}.msg{margin-top:16px;font-size:14px}</style></head><body><div class="card"><h1>Restablecer contraseña</h1>
<form id="f"><label>Nueva contraseña</label><input type="password" id="pw" required minlength="12"><label>Confirmar</label><input type="password" id="pw2" required minlength="12"><button type="submit">Actualizar</button></form><p class="msg" id="msg"></p></div>
<script>
const params=new URLSearchParams(location.search);
const token=params.get('token');
const msg=document.getElementById('msg');
document.getElementById('f').addEventListener('submit',async(e)=>{
  e.preventDefault();
  const pw=document.getElementById('pw').value;
  const pw2=document.getElementById('pw2').value;
  if(pw!==pw2){msg.textContent='Las contraseñas no coinciden.';msg.style.color='#dc2626';return;}
  const res=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,newPassword:pw})});
  const d=await res.json();
  if(res.ok){msg.textContent=d.message||'Contraseña actualizada.';msg.style.color='#16a34a';}
  else{msg.textContent=d?.error?.message||'Error.';msg.style.color='#dc2626';}
});
if(!token){msg.textContent='Token faltante en el enlace.';msg.style.color='#dc2626';}
</script></body></html>
