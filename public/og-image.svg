<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" >
  <defs>
    <pattern id="p" width="80" height="80" patternUnits="userSpaceOnUse">
      <g fill="#FFFFFF" opacity="0.04">
        <circle cx="10" cy="10" r="1"/>
        <circle cx="50" cy="10" r="1"/>
        <circle cx="10" cy="50" r="1"/>
        <circle cx="50" cy="50" r="1"/>
        <rect x="20" y="20" width="3" height="3"/>
        <rect x="60" y="20" width="3" height="3"/>
        <rect x="20" y="60" width="3" height="3"/>
        <rect x="60" y="60" width="3" height="3"/>
      </g>
    </pattern>
  </defs>
  <!-- Fondo -->
  <rect width="1200" height="630" fill="#002B7F"/>
  <rect width="1200" height="630" fill="url(#p)"/>
  <!-- Arco decorativo derecho -->
  <circle cx="1100" cy="315" r="280" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.15"/>
  <circle cx="1100" cy="315" r="220" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.10"/>
  <!-- Monograma grande izquierdo -->
  <g transform="translate(140, 215)">
    <rect width="200" height="200" rx="40" fill="#FFFFFF"/>
    <rect x="30" y="50" width="140" height="120" rx="8" fill="#002B7F"/>
    <!-- QR dots grandes -->
    <g fill="#FFFFFF">
      <rect x="45" y="65" width="15" height="15"/>
      <rect x="70" y="65" width="15" height="15"/>
      <rect x="95" y="65" width="15" height="15"/>
      <rect x="120" y="65" width="15" height="15"/>
      <rect x="145" y="65" width="15" height="15"/>
      <rect x="45" y="90" width="15" height="15"/>
      <rect x="95" y="90" width="15" height="15"/>
      <rect x="145" y="90" width="15" height="15"/>
      <rect x="45" y="115" width="15" height="15"/>
      <rect x="70" y="115" width="15" height="15"/>
      <rect x="120" y="115" width="15" height="15"/>
      <rect x="145" y="115" width="15" height="15"/>
      <rect x="45" y="140" width="15" height="15"/>
      <rect x="95" y="140" width="15" height="15"/>
      <rect x="145" y="140" width="15" height="15"/>
    </g>
    <rect x="30" y="40" width="140" height="10" rx="2" fill="#D4AF37"/>
  </g>
  <!-- Texto principal (safe zone 100px) -->
  <g transform="translate(400, 280)">
    <text x="0" y="0" font-family="Orbitron, 'Inter', sans-serif" font-size="72" font-weight="700" fill="#FFFFFF" letter-spacing="-0.02em">ARK Cash Register</text>
    <text x="0" y="60" font-family="'Inter', sans-serif" font-size="28" font-weight="400" fill="#FFFFFF" opacity="0.85">La caja registradora digital para el comerciante mexicano</text>
    <text x="0" y="110" font-family="'Inter', sans-serif" font-size="18" font-weight="600" fill="#D4AF37" letter-spacing="0.12em">COBRA CON CODI® · QR · LINK DE PAGO</text>
  </g>
  <!-- Badge Pey (esquina inferior derecha, safe zone) -->
  <g transform="translate(920, 540)">
    <rect width="180" height="40" rx="20" fill="#FFFFFF" opacity="0.10"/>
    <text x="90" y="25" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.08em">POWERED BY</text>
    <text x="90" y="38" font-family="Orbitron, sans-serif" font-size="14" font-weight="700" fill="#0067F1" text-anchor="middle">PEY · CoDi®</text>
  </g>
  <!-- Línea dorada inferior -->
  <rect x="100" y="580" width="120" height="3" fill="#D4AF37"/>
</svg>